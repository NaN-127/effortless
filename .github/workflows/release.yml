name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-release:
    name: Release / Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false # Set to true once DOCKER_REGISTRY_TOKEN secret is configured
          tags: |
            typeless-backend:${{ github.ref_name }}
            typeless-backend:latest

  client-android-release:
    name: Release / Client Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Android APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: effortless-android-${{ github.ref_name }}
          path: client/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 30

  client-desktop-release:
    name: Release / Client Desktop Distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Desktop Package
        run: ./gradlew :shared:desktopJar

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: effortless-desktop-${{ github.ref_name }}
          path: client/shared/build/libs/
          retention-days: 30
