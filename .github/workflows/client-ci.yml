name: Client CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-desktop:
    name: Client / Android & Desktop (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Desktop tests (JVM)
        run: ./gradlew :shared:desktopTest

      - name: Build Desktop JAR
        run: ./gradlew :shared:desktopJar

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: client/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7

  ios:
    name: Client / iOS Framework & Tests (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS Framework (Simulator ARM64)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Run iOS Simulator Tests
        run: ./gradlew :shared:iosSimulatorArm64Test
