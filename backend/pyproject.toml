[project]
name = "effortless"
version = "0.1.0"
description = "AI-powered voice translation backend for the Effortless keyboard"
authors = [
    { name = "Nandu Rajeev", email = "nandurajeev3@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    # Web framework
    # Justification: Core framework providing async HTTP/WS, OpenAPI generation,
    # Pydantic integration, and dependency injection.
    "fastapi>=0.115.0",

    # ASGI server
    # Justification: Production ASGI server required to run FastAPI. Standard
    # extras include uvloop and httptools for performance.
    "uvicorn[standard]>=0.30.0",

    # Configuration management
    # Justification: Type-safe environment variable loading with validation.
    # Required for the Settings pattern used in app/core/config.py.
    "pydantic-settings>=2.4.0",

    # Sarvam AI SDK
    # Justification: Official Python SDK for Sarvam AI services (Saaras STT,
    # Mayura translation, Sarvam-Translate). Verified from PyPI and docs.sarvam.ai.
    "sarvamai>=0.1.0",
]

[dependency-groups]
dev = [
    # Linter and formatter
    # Justification: Single tool for linting, formatting, and import sorting.
    # Replaces flake8 + black + isort with better performance.
    "ruff>=0.6.0",

    # Test framework
    # Justification: Standard Python test framework with superior fixture system.
    "pytest>=8.0.0",

    # Async test support
    # Justification: Required for testing async FastAPI handlers and use cases.
    "pytest-asyncio>=0.24.0",

    # HTTP test client
    # Justification: Async HTTP client used by FastAPI's test utilities.
    # Required for httpx.AsyncClient in API tests.
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (needed for Depends())
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
